# Live demo on GitHub Pages: dashboard from docs/demo/history + sample report.
# Requires Settings → Pages → Source: GitHub Actions.
name: Demo site

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'   # weekly, so the demo dates stay current
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: docs/demo/build.sh _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
