name: CI

on:
  push:
  pull_request:

jobs:
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit has Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $(git log -1 --format='%h %s' "$c") has no Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Sign off your commits: git rebase --signoff $BASE && git push --force (see CONTRIBUTING.md)"
            exit 1
          fi

  linux:
    name: Lint + tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD":/code -w /code koalaman/shellcheck-alpine:v0.10.0 \
            shellcheck -S warning anzen.sh anzen-tui.sh install.sh lib/*.sh lib/checks/*.sh lib/checks/runtimes/*.sh tests/distro-matrix.sh macos/anzen-macos.sh tests/macos/check-ids.sh packaging/*.sh
      - name: macOS edition under Bash 3.2
        run: |
          docker run --rm -v "$PWD":/code -w /code --entrypoint sh bash:3.2 -c \
            'apk add -q bats coreutils sed grep >/dev/null && bats tests/test_macos.bats && bash tests/macos/check-ids.sh'
      - name: bats
        run: |
          docker run --rm -v "$PWD":/code -w /code --entrypoint sh bats/bats:1.11.1 -c \
            'apk add -q python3 bash coreutils curl findutils grep tar >/dev/null && bats tests/'
      - name: Packages build and install (.deb on Debian, .rpm on Fedora)
        run: |
          docker run --rm -v "$PWD":/code -w /code ubuntu:24.04 bash -c \
            'apt-get update -qq >/dev/null && apt-get install -y -qq rpm file >/dev/null && packaging/build.sh 0.0.0 dist'
          docker run --rm -v "$PWD/dist":/p debian:12 bash -c \
            'apt-get update -qq >/dev/null && apt-get install -y -qq /p/anzen_0.0.0_all.deb >/dev/null && { anzen --check=kernel --quiet --no-color --offline --json || [ $? -eq 1 ]; } && ls /var/lib/anzen/reports/*.json'
          docker run --rm -v "$PWD/dist":/p fedora:41 bash -c \
            'dnf install -y -q /p/anzen-0.0.0-1.noarch.rpm >/dev/null && rpm -V anzen && { anzen --check=kernel --quiet --no-color --offline --json || [ $? -eq 1 ]; } && ls /var/lib/anzen/reports/*.json'

  distros:
    name: Distro matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tests/distro-matrix.sh

  windows:
    name: Windows edition
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path windows/anzen.ps1 -Severity Warning,Error `
            -ExcludeRule PSAvoidUsingWriteHost,PSUseApprovedVerbs,PSUseShouldProcessForStateChangingFunctions,PSUseSingularNouns
          $issues | Format-Table RuleName,Line,Message -AutoSize | Out-String -Width 200
          if ($issues) { exit 1 }
      - name: Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
          $r = Invoke-Pester -Path windows/tests -PassThru -Output Detailed
          if ($r.FailedCount) { exit 1 }
      - name: Full run on Windows PowerShell 5.1
        shell: powershell
        run: |
          .\windows\anzen.ps1 -Json -Html -Txt -Sarif -Output "$env:RUNNER_TEMP\anzen.json"
          # 0 = clean, 1 = FAIL findings (expected on a stock runner); anything else is a crash
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          $report = Get-Content "$env:RUNNER_TEMP\anzen.json" -Raw | ConvertFrom-Json
          $report.summary | Format-List
          if (-not $report.findings.Count) { Write-Error 'empty report'; exit 1 }
          $sarif = Get-Content "$env:RUNNER_TEMP\anzen.sarif.json" -Raw | ConvertFrom-Json
          if ($sarif.version -ne '2.1.0') { Write-Error 'bad SARIF'; exit 1 }
          foreach ($f in 'anzen.html', 'anzen.txt') {
            if (-not (Test-Path "$env:RUNNER_TEMP\$f")) { Write-Error "$f missing"; exit 1 }
          }
          exit 0
      - name: Fleet run over WinRM (-Remote localhost)
        shell: powershell
        run: |
          Enable-PSRemoting -Force -SkipNetworkProfileCheck | Out-Null
          .\windows\anzen.ps1 -Remote localhost -Html -History "$env:RUNNER_TEMP\history" -Output "$env:RUNNER_TEMP\fleet.html"
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          $runs = @(Get-ChildItem "$env:RUNNER_TEMP\history" -Recurse -Filter *.json)
          if ($runs.Count -ne 1) { Write-Error "expected 1 history run, got $($runs.Count)"; exit 1 }
          $report = Get-Content $runs[0].FullName -Raw | ConvertFrom-Json
          $report.summary | Format-List
          if (-not $report.findings.Count) { Write-Error 'empty remote report'; exit 1 }
          if (-not (Test-Path "$env:RUNNER_TEMP\fleet.html")) { Write-Error 'remote HTML missing'; exit 1 }
          exit 0
      - name: Scoop manifest installs (latest release tarball)
        shell: powershell
        run: |
          Invoke-RestMethod https://get.scoop.sh -OutFile "$env:RUNNER_TEMP\scoop-install.ps1"
          & "$env:RUNNER_TEMP\scoop-install.ps1" -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop install .\bucket\anzen.json
          $mods = anzen -List
          if ($mods -notcontains 'truststore') { Write-Error "anzen -List via Scoop shim failed: $mods"; exit 1 }

  macos:
    name: macOS edition
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Finding IDs match the Linux edition (BSD sed)
        run: /bin/bash tests/macos/check-ids.sh
      - name: Tests under the system Bash 3.2
        run: |
          /bin/bash --version | head -1
          brew install bats-core >/dev/null
          PATH="/bin:$PATH" bats tests/test_macos.bats
      - name: Full run as root on a real Mac
        run: |
          sudo /bin/bash macos/anzen-macos.sh --json --html --txt --sarif --output="$RUNNER_TEMP/anzen.json" || [ $? -eq 1 ]
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d['summary']); assert d['findings']" "$RUNNER_TEMP/anzen.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['version'] == '2.1.0'" "$RUNNER_TEMP/anzen.sarif.json"
          grep -q 'macOS Security Audit' "$RUNNER_TEMP/anzen.html" "$RUNNER_TEMP/anzen.txt"
      - name: Homebrew formula installs (latest release tarball)
        run: |
          brew tap-new --no-git local/anzen >/dev/null
          cp Formula/anzen.rb "$(brew --repo local/anzen)/Formula/"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install --quiet local/anzen/anzen
          anzen --version | grep '^anzen-macos '
