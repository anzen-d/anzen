name: CI

on:
  push:
  pull_request:

jobs:
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit has Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $(git log -1 --format='%h %s' "$c") has no Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Sign off your commits: git rebase --signoff $BASE && git push --force (see CONTRIBUTING.md)"
            exit 1
          fi

  linux:
    name: Lint + tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD":/code -w /code koalaman/shellcheck-alpine:v0.10.0 \
            shellcheck -S warning anzen.sh anzen-tui.sh install.sh lib/*.sh lib/checks/*.sh lib/checks/runtimes/*.sh tests/distro-matrix.sh
      - name: bats
        run: |
          docker run --rm -v "$PWD":/code -w /code --entrypoint sh bats/bats:1.11.1 -c \
            'apk add -q python3 bash coreutils curl findutils grep tar >/dev/null && bats tests/'

  distros:
    name: Distro matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tests/distro-matrix.sh

  windows:
    name: Windows edition
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path windows/anzen.ps1 -Severity Warning,Error `
            -ExcludeRule PSAvoidUsingWriteHost,PSUseApprovedVerbs,PSUseShouldProcessForStateChangingFunctions,PSUseSingularNouns
          $issues | Format-Table RuleName,Line,Message -AutoSize | Out-String -Width 200
          if ($issues) { exit 1 }
      - name: Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
          $r = Invoke-Pester -Path windows/tests -PassThru -Output Detailed
          if ($r.FailedCount) { exit 1 }
      - name: Full run on Windows PowerShell 5.1
        shell: powershell
        run: |
          .\windows\anzen.ps1 -Output "$env:RUNNER_TEMP\anzen.json"
          # 0 = clean, 1 = FAIL findings (expected on a stock runner); anything else is a crash
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          $report = Get-Content "$env:RUNNER_TEMP\anzen.json" -Raw | ConvertFrom-Json
          $report.summary | Format-List
          if (-not $report.findings.Count) { Write-Error 'empty report'; exit 1 }
          exit 0
